<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Financeiro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Financeiro">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única de até 620px; mês no topo, 4 abas fixas,
   o número "livre para gastar" é o único elemento grande da página. */
:root{
  --bg:#0b0b0c; --surface:#19191b; --ink:#f2f2f3; --muted:#9c9ca3; --line:#2d2d31;
  --accent:#e4e4e7; --accent-ink:#111113; --in:#5fcf8e; --out:#f0826e; --soft:#26262a; --gold:#8e8e95;
  --hero-a:#000000; --hero-b:#3b3b40;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0c; --surface:#19191b; --ink:#f2f2f3; --muted:#9c9ca3; --line:#2d2d31;
    --accent:#e4e4e7; --accent-ink:#111113; --in:#5fcf8e; --out:#f0826e; --soft:#26262a; --gold:#8e8e95;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --surface:#19191b; --ink:#f2f2f3; --muted:#9c9ca3; --line:#2d2d31;
  --accent:#e4e4e7; --accent-ink:#111113; --in:#5fcf8e; --out:#f0826e; --soft:#26262a; --gold:#8e8e95;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 120px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--in)} .sync.err i{background:var(--out)}

.mes{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:6px}
.mes button{width:44px;height:44px;border:0;border-radius:10px;background:var(--soft);font-size:20px;font-weight:700}
.mes strong{font-family:var(--display);font-size:18px;text-transform:capitalize;text-align:center}
.mes small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);text-transform:none}

nav.abas{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 0;margin-bottom:6px}
nav.abas a{text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:10px 2px;border-radius:10px}
nav.abas a[aria-current="page"]{background:var(--ink);color:var(--bg)}

.aviso{background:var(--soft);border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.aviso b{color:var(--accent)}

section.tela{display:none;flex-direction:column;gap:14px}
section.tela.on{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-family:var(--display);font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
.card p{margin:0 0 10px}
.rot{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.s{font-size:13px;color:var(--muted)}

.sobra{background:var(--ink);color:var(--bg);border-radius:20px;padding:20px}
.sobra .rot{color:inherit;opacity:.7}
.sobra .num{font-family:var(--display);font-weight:800;font-size:clamp(38px,12vw,58px);line-height:1.05;letter-spacing:-.03em;margin:4px 0 12px;overflow-wrap:anywhere}
.sobra .num.neg{color:var(--out)}
.trilho{height:12px;border-radius:99px;background:color-mix(in srgb,var(--bg) 22%,transparent);overflow:hidden}
.trilho b{display:block;height:100%;border-radius:99px;background:var(--accent)}
.trilho b.est{background:var(--out)}
.sobra p{margin:10px 0 0;font-size:15px;opacity:.9}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .card{padding:14px}
.val{font-family:var(--display);font-weight:700;font-size:22px;margin-top:2px;overflow-wrap:anywhere}
.in{color:var(--in)} .out{color:var(--out)}

.linha{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.linha:first-of-type{border-top:0;padding-top:0}
.linha .t{font-weight:600;overflow-wrap:anywhere}
.linha .v{font-weight:700;text-align:right;white-space:nowrap}
.barra{grid-column:1/-1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.barra.g{height:12px;margin:8px 0 12px}
.barra b{display:block;height:100%;border-radius:99px;background:var(--accent)}
.barra b.top{background:var(--out)} .barra b.low,.barra b.ok{background:var(--in)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink);margin-left:6px;vertical-align:middle;white-space:nowrap}
.pill.top{background:var(--out);color:var(--surface)} .pill.low{background:var(--in);color:var(--surface)}

.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.filtros button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0}
button.item:first-child{border-top:0}
button.item .t{font-weight:600;overflow-wrap:anywhere}
button.item .v{font-weight:700;white-space:nowrap}
button.item .s{grid-column:1/-1}
.vazio{color:var(--muted);font-size:15px;margin:0}
.banco{border-top:1px solid var(--line);padding:14px 0}
h2 + .banco{border-top:0;padding-top:0}
.bcab{display:flex;justify-content:space-between;align-items:center;gap:10px}
.banco .nome{font-family:var(--display);font-weight:700;font-size:17px;overflow-wrap:anywhere}
.alt{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:99px;padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.bbloco{margin-top:10px}
.bbloco b{display:block;font-family:var(--display);font-size:24px;line-height:1.2;overflow-wrap:anywhere}
.bbloco.lim{border-top:1px dashed var(--line);padding-top:10px}
.bbloco.lim b{font-size:20px}
.bbloco .barra{margin:6px 0 4px}
.diah{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:8px;padding:6px 10px;margin-top:10px;text-transform:capitalize}
.diah:first-child{margin-top:0}
.diah + button.item{border-top:0}
button.item .hora{font-size:12px;color:var(--muted);grid-column:1/-1}

.conta{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.conta:first-of-type{border-top:0;padding-top:0}
.conta .meio{background:none;border:0;padding:0;text-align:left;min-width:0}
.conta .t{font-weight:600;overflow-wrap:anywhere;display:block}
.conta .s{display:block}
.conta .s.atras{color:var(--out);font-weight:700}
.conta .v{font-weight:700;white-space:nowrap}
.conta.paga .t,.conta.paga .v{opacity:.55;text-decoration:line-through}
.chk2{width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);background:none;font-weight:800;font-size:16px;color:transparent;padding:0}
.chk2[aria-pressed="true"]{background:var(--in);border-color:var(--in);color:var(--surface)}
.dia{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px}
.mais{width:100%;border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:12px;padding:12px;font-weight:700;margin-top:12px}
.cheio{width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:13px;font-weight:700;text-align:center;text-decoration:none;display:block}
a.atalho{display:flex;justify-content:space-between;gap:10px;align-items:center;text-decoration:none;color:inherit;font-weight:600}
a.atalho b{font-family:var(--display);font-size:18px;white-space:nowrap}
.meta{display:grid;grid-template-columns:1fr auto;gap:8px}
.meta input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:18px;font-weight:700;min-width:0;width:100%}
.meta button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 18px;font-weight:700}

.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:140px;border-bottom:1px solid var(--line)}
.col{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%}
.col i{width:42%;max-width:18px;border-radius:5px 5px 0 0;min-height:2px;display:block}
.col i.e{background:var(--in)} .col i.s{background:var(--out)}
.colsleg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}
.colsleg b{display:block;font-size:11px;font-weight:700}
.leg{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:6;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--display);font-weight:700;font-size:17px;padding:15px 28px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

.fundo{position:fixed;inset:0;z-index:10;background:rgba(5,20,23,.55);display:none;align-items:flex-end;justify-content:center}
.fundo.on{display:flex}
.folha{background:var(--surface);width:100%;max-width:620px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px}
.folha h2{font-family:var(--display);font-size:20px;margin:0 0 12px}
form{display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;padding:11px;font-weight:700}
.seg button[aria-pressed="true"][data-t="saida"]{background:var(--out);color:var(--surface)}
.seg button[aria-pressed="true"][data-t="entrada"]{background:var(--in);color:var(--surface)}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.campo input,label.campo select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;color:var(--ink);font-weight:500;width:100%;min-width:0}
label.campo input.grande{font-family:var(--display);font-size:28px;font-weight:700}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details summary{font-weight:700;cursor:pointer}
details .dentro{display:flex;flex-direction:column;gap:12px;margin-top:12px}
label.chk{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px}
label.chk input{width:22px;height:22px;accent-color:var(--accent)}
.dica{font-size:14px;color:var(--accent);font-weight:600;margin:0}
.dica:empty{display:none}
.erro{font-size:14px;color:var(--out);font-weight:600;margin:0}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acoes button{flex:1;border-radius:12px;padding:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);min-width:110px}
.acoes .ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.acoes .del{color:var(--out);border-color:var(--out)}
@media (max-width:360px){.duo,.par{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.trilho b,.barra b{transition:width .4s ease}}

/* ---- tema: cédula e cartão ---- */
header.top{justify-content:flex-start}
.quem{flex:1;min-width:0}
.ola{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:50px;height:50px;border-radius:50%;border:2px solid var(--gold);background:var(--soft);padding:0;overflow:hidden;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:20px;color:var(--accent);flex:none}
.avatar img,.previa img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg,.previa svg{width:60%;height:60%}
.previa{width:112px;height:112px;border-radius:50%;border:3px solid var(--gold);background:var(--soft);overflow:hidden;display:grid;place-items:center;color:var(--accent);margin:0 auto}
.arq{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.cheio{cursor:pointer}
.arq:focus-visible + label.cheio{outline:3px solid var(--accent);outline-offset:2px}
nav.abas a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;padding:8px 2px}
nav.abas svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sobra{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#f2f9f3;border:1px solid rgba(255,255,255,.14)}
.sobra::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.11) 0 1px,transparent 1px 9px);pointer-events:none}
.sobra::after{content:"R$";position:absolute;right:12px;bottom:-22px;font-family:var(--display);font-weight:800;font-size:112px;line-height:1;color:rgba(255,255,255,.07);pointer-events:none}
.sobra>*{position:relative;z-index:1}
.sobra .num.neg{color:#ffb9a8}
.sobra .trilho{background:rgba(255,255,255,.2)}
.sobra .trilho b{background:#d4d4d8}
.sobra .trilho b.est{background:#ffb9a8}
.banco{border:1px solid #3a3a40;border-radius:16px;padding:16px;margin-top:10px;color:#f4f8f5;position:relative;overflow:hidden;background:linear-gradient(135deg,#1e1e21,#4b4b52)}
.banco.c1{background:linear-gradient(135deg,#0f0f10,#3a3a40)}
.banco.c2{background:linear-gradient(135deg,#2a2a2e,#62626a)}
.banco.c3{background:linear-gradient(135deg,#161618,#45454b)}
h2 + .banco{padding-top:16px;margin-top:0}
.banco::after{content:"";position:absolute;right:-50px;bottom:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.banco>*{position:relative;z-index:1}
.banco .nome{flex:1;min-width:0}
.chip{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#e2e2e6,#8e8e95);flex:none}
.banco .s{color:rgba(255,255,255,.78)}
.banco .bbloco b.in{color:#ffffff}
.banco .bbloco b.out{color:#ffb9a8}
.banco .alt{border-color:rgba(255,255,255,.65);color:#ffffff}
.banco .bbloco.lim{border-top:1px dashed rgba(255,255,255,.32)}
.banco .barra{background:rgba(255,255,255,.22)}
.banco .barra b{background:#d4d4d8}
.fab{border:2px solid var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button type="button" class="avatar" id="perfil-btn" aria-label="Mudar foto e nome"></button>
    <div class="quem"><div class="ola" id="ola"></div><div class="brand">Meu <span>Financeiro</span></div></div>
    <div class="sync" id="sync"><i></i><span id="sync-txt">Carregando…</span></div>
  </header>

  <div class="mes">
    <button type="button" id="mes-ant" aria-label="Mês anterior">‹</button>
    <strong id="mes-nome"></strong>
    <button type="button" id="mes-prox" aria-label="Próximo mês">›</button>
  </div>

  <nav class="abas" aria-label="Abas">
    <a href="#resumo" data-aba="resumo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></a>
    <a href="#extrato" data-aba="extrato"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>Extrato</span></a>
    <a href="#contas" data-aba="contas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg><span>Contas</span></a>
    <a href="#guardar" data-aba="guardar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6.500v11M15 9.500c-.6-1-1.700-1.500-3-1.500-1.700 0-3 .9-3 2.200 0 3 6 1.400 6 4.300 0 1.300-1.300 2.200-3 2.200-1.400 0-2.600-.6-3.200-1.600"/></svg><span>Guardar</span></a>
  </nav>

  <div class="aviso" id="aviso" hidden><b>Dados de exemplo.</b> Eles somem quando você fizer seu primeiro lançamento.</div>

  <section class="tela" id="t-resumo"></section>
  <section class="tela" id="t-extrato"></section>
  <section class="tela" id="t-contas"></section>
  <section class="tela" id="t-guardar"></section>
</div>

<button type="button" class="fab" id="novo">+ Lançar</button>

<div class="fundo" id="fundo">
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="f-titulo">
    <h2 id="f-titulo">Novo lançamento</h2>
    <form id="form" novalidate>
      <div class="seg" role="group" aria-label="Tipo">
        <button type="button" id="f-saida" data-t="saida" aria-pressed="true">Saiu dinheiro</button>
        <button type="button" id="f-entrada" data-t="entrada" aria-pressed="false">Entrou dinheiro</button>
      </div>
      <label class="campo" for="f-valor">Valor (R$)
        <input class="grande" id="f-valor" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
      </label>
      <div class="par">
        <label class="campo" for="f-cat">Categoria
          <select id="f-cat"></select>
        </label>
        <label class="campo" for="f-forma">Como foi pago
          <select id="f-forma"></select>
        </label>
      </div>
      <label class="campo" for="f-banco" id="l-banco">Banco
        <select id="f-banco"></select>
      </label>
      <label class="campo" for="f-desc">Descrição (opcional)
        <input id="f-desc" type="text" maxlength="60" placeholder="Ex.: Mercado, salário, tênis" autocomplete="off">
      </label>
      <details id="f-mais">
        <summary>Data, parcelas e conta fixa</summary>
        <div class="dentro">
          <label class="campo" for="f-data">Data ou vencimento
            <input id="f-data" type="date">
          </label>
          <label class="campo" for="f-parc" id="l-parc">Parcelas (o valor acima é o total)
            <select id="f-parc"></select>
          </label>
          <label class="chk" for="f-apagar" id="l-apagar"><input id="f-apagar" type="checkbox"> Ainda vou pagar (conta a pagar)</label>
          <label class="chk" for="f-quinto" id="l-quinto"><input id="f-quinto" type="checkbox"> Cai no 5º dia útil do mês</label>
          <label class="chk" for="f-fixo"><input id="f-fixo" type="checkbox"> Repete todo mês (fixo)</label>
        </div>
      </details>
      <p class="dica" id="f-dica"></p>
      <p class="erro" id="f-erro" hidden></p>
      <div class="acoes">
        <button type="button" class="del" id="f-excluir" hidden>Excluir</button>
        <button type="button" id="f-cancelar">Cancelar</button>
        <button type="submit" class="ok">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div class="fundo" id="fundo-p">

<script>
(function(){
"use strict";
var KEY="meu-caixa-v1",RES="Reserva";
var CATS={saida:["Mercado","Alimentação","Moradia","Água","Luz","Internet e celular","Faculdade","Contas","Transporte","Saúde","Estudos","Lazer","Compras","Assinaturas","Outros",RES],
          entrada:["Salário","Adiantamento","Extra","Vale / Benefício","13º e férias","Freelance","Vendas","Presente","Outros"]};
var FORMAS=["Pix","Dinheiro","Débito","Crédito","Boleto","Transferência"];
var $=function(s){return document.querySelector(s)};
var hoje=new Date();
var state={items:[],perfil:{nome:"",foto:""},bancos:[],ultimoBanco:"",editBanco:null,meta:0,iniciado:false,y:hoje.getFullYear(),m:hoje.getMonth(),filtro:"todos",editId:null,tipo:"saida"};

/* ---------- dinheiro e datas ---------- */
var fmt=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
function R(c){return fmt.format(c/100)}
function curto(c){var v=Math.abs(c)/100,s=c<0?"-":"";return s+(v>=1000?(v/1000).toFixed(1).replace(".",",")+" mil":Math.round(v))}
function parseValor(t){
  t=String(t).trim().replace(/[R$\s]/g,"");
  if(!t)return NaN;
  if(t.indexOf(",")>-1)t=t.replace(/\./g,"").replace(",",".");
  var n=Number(t);return isFinite(n)?Math.round(n*100):NaN;
}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function idxDe(dataIso){var p=dataIso.split("-");return Number(p[0])*12+Number(p[1])-1}
function idxAtual(){return state.y*12+state.m}
var IDX_HOJE=hoje.getFullYear()*12+hoje.getMonth();
function nomeMes(idx,longo){var d=new Date(Math.floor(idx/12),idx%12,1);
  return longo?d.toLocaleDateString("pt-BR",{month:"long"}):d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")}
function mesAno(idx){return nomeMes(idx)+"/"+Math.floor(idx/12)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* Quanto um lançamento pesa em um mês. Parcelado: total dividido, centavos que sobram vão na 1ª parcela. */
function ocorre(it,idx){
  var ini=idxDe(it.data);
  if(it.fixo)return idx>=ini?{valor:it.valor}:null;
  var n=it.parcelas||1,k=idx-ini;
  if(k<0||k>=n)return null;
  var base=Math.floor(it.valor/n);
  return {valor:base+(k===0?it.valor-base*n:0),k:k+1,de:n};
}
function dados(){return state.iniciado?state.items:EXEMPLOS}
function meta(){return state.iniciado?(state.meta||0):30000}
function doMes(idx){
  var out=[];dados().forEach(function(it){var o=ocorre(it,idx);if(o)out.push({it:it,o:o})});
  out.sort(function(a,b){return b.it.data.slice(8).localeCompare(a.it.data.slice(8))});
  return out;
}
/* e = entrou, s = gastou (sem o que foi guardado), g = guardado, sobra = o que resta parado */
function totais(idx){var e=0,s=0,g=0;doMes(idx).forEach(function(x){
  if(x.it.tipo==="entrada")e+=x.o.valor;else if(x.it.cat===RES)g+=x.o.valor;else s+=x.o.valor});
  return{e:e,s:s,g:g,sobra:e-s-g}}
function totalGuardado(idx){var t=0;dados().forEach(function(it){
  if(it.tipo!=="saida"||it.cat!==RES)return;
  var ini=idxDe(it.data);if(idx<ini)return;
  if(it.fixo)t+=it.valor*(idx-ini+1);
  else for(var k=ini;k<=Math.min(idx,ini+(it.parcelas||1)-1);k++)t+=ocorre(it,k).valor});
  return t}
function porCategoria(idx){var cat={},tot=0;doMes(idx).forEach(function(x){
  if(x.it.tipo==="saida"&&x.it.cat!==RES){cat[x.it.cat]=(cat[x.it.cat]||0)+x.o.valor;tot+=x.o.valor}});
  return{cat:cat,tot:tot,ord:Object.keys(cat).sort(function(a,b){return cat[b]-cat[a]})}}

/* ---------- exemplos (só aparecem antes do primeiro lançamento) ---------- */
function dEx(desloc,dia){return iso(new Date(hoje.getFullYear(),hoje.getMonth()+desloc,dia))}
var EXEMPLOS=[
 {id:"e1",tipo:"entrada",desc:"Salário",valor:320000,data:dEx(-6,5),cat:"Salário",forma:"Transferência",parcelas:1,fixo:true},
 {id:"e2",tipo:"saida",desc:"Aluguel",valor:110000,data:dEx(-6,10),cat:"Moradia",forma:"Boleto",parcelas:1,fixo:true},
 {id:"e3",tipo:"saida",desc:"Internet",valor:9990,data:dEx(-6,12),cat:"Contas",forma:"Débito",parcelas:1,fixo:true},
 {id:"e4",tipo:"saida",desc:"Celular novo",valor:240000,data:dEx(-2,18),cat:"Compras",forma:"Crédito",parcelas:10},
 {id:"e5",tipo:"saida",desc:"Tênis",valor:45000,data:dEx(0,3),cat:"Compras",forma:"Crédito",parcelas:3},
 {id:"e6",tipo:"saida",desc:"Mercado do mês",valor:62000,data:dEx(0,6),cat:"Mercado",forma:"Pix",parcelas:1},
 {id:"e7",tipo:"saida",desc:"Cinema e lanche",valor:8600,data:dEx(0,8),cat:"Lazer",forma:"Dinheiro",parcelas:1},
 {id:"e8",tipo:"saida",desc:"Ônibus",valor:18000,data:dEx(0,2),cat:"Transporte",forma:"Pix",parcelas:1},
 {id:"e9",tipo:"entrada",desc:"Serviço extra",valor:40000,data:dEx(0,9),cat:"Freelance",forma:"Pix",parcelas:1},
 {id:"e10",tipo:"saida",desc:"Streaming",valor:3990,data:dEx(-4,15),cat:"Assinaturas",forma:"Crédito",parcelas:1,fixo:true},
 {id:"e11",tipo:"saida",desc:"Guardado",valor:15000,data:dEx(0,6),cat:RES,forma:"Pix",parcelas:1},
 {id:"e12",tipo:"saida",desc:"Guardado",valor:30000,data:dEx(-1,6),cat:RES,forma:"Pix",parcelas:1}
];

/* ---------- guardar na conta ---------- */
var ref=null,salvando=false,sujo=false,mexidos=new Set();
function setSync(tipo){
  var el=$("#sync"),t=$("#sync-txt");el.className="sync";
  if(tipo==="nuvem"){el.classList.add("ok");t.textContent="Salvo na sua conta"}
  else if(tipo==="salvando"){t.textContent="Salvando…"}
  else if(tipo==="local"){t.textContent="Salvo só neste aparelho"}
  else if(tipo==="erro"){el.classList.add("err");t.textContent="Não salvou na conta. Tente de novo."}
  else t.textContent="Carregando…";
}
function limpaPerfil(p){p=p||{};var f=String(p.foto||"");return{nome:String(p.nome||"").slice(0,30),foto:f.indexOf("data:image/")===0?f:""}}
function salvarPerfil(){mexidos.add("__perfil");gravarLocal();sujo=true;enviar()}
function lerLocal(){try{var j=JSON.parse(localStorage.getItem(KEY)||"null");if(j&&Array.isArray(j.items)){state.items=j.items;state.iniciado=!!j.iniciado;state.meta=Number(j.meta)||0;state.bancos=Array.isArray(j.bancos)?j.bancos:[];state.perfil=limpaPerfil(j.perfil)}}catch(e){}}
function gravarLocal(){try{localStorage.setItem(KEY,JSON.stringify({items:state.items,iniciado:state.iniciado,meta:state.meta,bancos:state.bancos,perfil:state.perfil}))}catch(e){}}
function guardar(id){state.iniciado=true;if(id)mexidos.add(id);gravarLocal();sujo=true;enviar()}
async function enviar(){
  if(!ref||salvando)return;
  salvando=true;setSync("salvando");
  while(sujo){
    sujo=false;
    var corpo={items:JSON.parse(JSON.stringify(state.items)),meta:state.meta||0,bancos:JSON.parse(JSON.stringify(state.bancos)),perfil:{nome:state.perfil.nome,foto:state.perfil.foto},iniciado:state.iniciado,atualizado:Date.now()};
    try{await ref.set(corpo)}
    catch(e){
      try{await new Promise(function(r){setTimeout(r,800+Math.random()*800)});await ref.set(corpo)}
      catch(e2){salvando=false;sujo=true;setSync("erro");return}
    }
  }
  salvando=false;setSync("nuvem");
}
async function ligarConta(){
  var limite=setTimeout(function(){if(!ref)setSync("local")},10000);
  try{
    if(!window.claude||!window.claude.use){clearTimeout(limite);setSync("local");return}
    var db=await window.claude.use("db"),user=await window.claude.use("user");
    var uid=db&&user?await user.id():null;
    if(!uid){clearTimeout(limite);setSync("local");return}
    var r=db.doc("data/users/"+uid+"/financas");
    var snap=await r.get();
    clearTimeout(limite);
    if(snap.exists){
      var d=snap.data()||{};
      var nuvem=JSON.parse(JSON.stringify(Array.isArray(d.items)?d.items:[]));
      if(!mexidos.has("__bancos"))state.bancos=JSON.parse(JSON.stringify(Array.isArray(d.bancos)?d.bancos:[]));
      if(mexidos.size){
        var locais=state.items.filter(function(i){return mexidos.has(i.id)});
        state.items=nuvem.filter(function(i){return !mexidos.has(i.id)}).concat(locais);
        if(!mexidos.has("__meta"))state.meta=Number(d.meta)||0;
        sujo=true;
      }else{state.items=nuvem;state.meta=Number(d.meta)||0}
      if(!mexidos.has("__perfil"))state.perfil=limpaPerfil(d.perfil);
      state.iniciado=d.iniciado!==false||state.iniciado;gravarLocal();
    }else if(state.iniciado||state.perfil.foto||state.perfil.nome)sujo=true;
    ref=r;setSync("nuvem");desenhar();
    if(sujo)enviar();
  }catch(e){clearTimeout(limite);setSync("local")}
}

/* ---------- bancos ---------- */
var EX_BANCOS=[{id:"b1",nome:"Banco A (exemplo)",saldo:184050,limite:300000,usado:126000,em:0},
               {id:"b2",nome:"Banco B (exemplo)",saldo:32000,limite:150000,usado:45000,em:0}];
function bancos(){return state.iniciado?state.bancos:EX_BANCOS}
/* Parte do valor que você informou e aplica o que foi lançado ou pago nesse banco depois disso. */
function bancoAgora(b){
  var s=b.saldo||0,l=(b.limite||0)-(b.usado||0),T=b.em||0,agora=Date.now(),dT=new Date(T),idxT=dT.getFullYear()*12+dT.getMonth();
  if(state.iniciado)state.items.forEach(function(it){
    if(it.banco!==b.id)return;
    var cred=it.forma==="Crédito";
    if(it.tipo==="entrada"){
      if(!it.fixo){if((it.criado||0)>T)s+=it.valor}
      else for(var k=Math.max(idxDe(it.data),idxT);k<=IDX_HOJE;k++){
        var dt=new Date(Math.floor(k/12),k%12,diaNoMes(it,k)).getTime();if(dt>T&&dt<=agora)s+=it.valor}
      return;
    }
    var conta=ehConta(it);
    if(cred){if(!it.fixo&&(it.criado||0)>T)l-=it.valor}
    else if(!conta){if((it.criado||0)>T)s-=it.valor}
    if(conta&&it.pagos)Object.keys(it.pagos).forEach(function(k){
      var ts=it.pagos[k];if(typeof ts!=="number"||ts<=T)return;
      var o=ocorre(it,Number(k));if(!o)return;
      if(cred){if(!it.fixo)l+=o.valor}else s-=o.valor});
  });
  return{saldo:s,disp:l};
}
function bancosHtml(){
  var bs=bancos(),h='<div class="card"><h2>Meus bancos</h2>',ts=0,tl=0;
  if(!bs.length)h+='<p class="vazio">Cadastre seus bancos para ver saldo e limite aqui.</p>';
  bs.forEach(function(b,bi){var a=bancoAgora(b),lim=b.limite||0;ts+=a.saldo;tl+=lim?a.disp:0;
    h+='<div class="banco c'+(bi%4)+'"><div class="bcab"><span class="chip"></span><span class="nome">'+esc(b.nome)+'</span>'+
      '<button type="button" class="alt" data-banco="'+esc(b.id)+'">Alterar</button></div>'+
      '<div class="bbloco"><span class="s">Saldo disponível</span><b class="'+(a.saldo<0?"out":"in")+'">'+R(a.saldo)+'</b></div>'+
      (lim?'<div class="bbloco lim"><span class="s">Limite disponível</span><b class="'+(a.disp<0?"out":"")+'">'+R(a.disp)+'</b>'+
        '<div class="barra"><b style="width:'+Math.max(0,Math.min(100,Math.round((lim-a.disp)/lim*100)))+'%"></b></div>'+
        '<span class="s">Usado '+R(lim-a.disp)+' de '+R(lim)+'</span></div>'
        :'<div class="bbloco lim"><span class="s">Sem cartão de crédito cadastrado</span></div>')+'</div>'});
  if(bs.length>1)h+='<div class="linha" style="border-top:1px solid var(--line);padding-top:10px"><div class="t">Saldo somado</div><div class="v">'+R(ts)+'</div></div>'+
    '<div class="linha"><div class="t">Limite disponível somado</div><div class="v">'+R(tl)+'</div></div>';
  return h+'<button type="button" class="mais" data-addbanco="1">+ Adicionar banco</button></div>';
}

/* ---------- telas ---------- */
var heroAnt=null;
function anima(el,de,para){
  var parado=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(de===null||de===para||parado){el.textContent=R(para);return}
  var t0=performance.now();
  (function passo(t){var p=Math.min(1,(t-t0)/500);p=1-Math.pow(1-p,3);
    el.textContent=R(Math.round(de+(para-de)*p));if(p<1)requestAnimationFrame(passo)})(t0);
}
var PESSOA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.500" r="4"/><path d="M4 20.500c1.200-3.800 4.300-5.500 8-5.500s6.800 1.700 8 5.500"/></svg>';
function desenharPerfil(){
  var p=state.perfil,b=$("#perfil-btn");
  if(p.foto){b.innerHTML='<img alt="">';b.firstChild.src=p.foto}
  else if(p.nome)b.textContent=p.nome.charAt(0).toUpperCase();
  else b.innerHTML=PESSOA;
  $("#ola").textContent=p.nome?"Olá, "+p.nome:"Toque na foto para colocar a sua";
}
var fotoPend="";
function previa(){var el=$("#p-previa");if(fotoPend){el.innerHTML='<img alt="Sua foto">';el.firstChild.src=fotoPend}else el.innerHTML=PESSOA;$("#p-remover").hidden=!fotoPend}
function abrirPerfil(){fotoPend=state.perfil.foto||"";$("#p-nome").value=state.perfil.nome||"";$("#p-erro").hidden=true;previa();$("#fundo-p").classList.add("on")}
function fecharPerfil(){$("#fundo-p").classList.remove("on")}
function desenhar(){
  var idx=idxAtual();desenharPerfil();
  $("#mes-nome").innerHTML=esc(nomeMes(idx,true))+"<small>"+state.y+"</small>";
  $("#aviso").hidden=state.iniciado;
  resumo(idx);extrato(idx);contas(idx);guardarTela(idx);
}
function rankingHtml(idx){
  var c=porCategoria(idx),h="";
  if(!c.ord.length)return'<p class="vazio">Sem gastos neste mês para mostrar.</p>';
  c.ord.forEach(function(n,i){
    var topo=i===0&&c.ord.length>1,baixo=i===c.ord.length-1&&c.ord.length>1;
    h+='<div class="linha"><div class="t">'+esc(n)+(topo?'<span class="pill top">Mais gastou</span>':baixo?'<span class="pill low">Menos gastou</span>':'')+'</div>'+
      '<div class="v">'+R(c.cat[n])+' <span class="s" style="font-weight:500">'+Math.round(c.cat[n]/c.tot*100)+'%</span></div>'+
      '<div class="barra"><b class="'+(topo?"top":baixo?"low":"")+'" style="width:'+Math.max(2,Math.round(c.cat[n]/c.cat[c.ord[0]]*100))+'%"></b></div></div>'});
  return h;
}
function resumo(idx){
  var t=totais(idx),M=meta(),reserva=Math.max(M,t.g),livre=t.e-t.s-reserva;
  var temMeta=reserva>0,pct=t.e>0?Math.min(100,Math.round((t.s+reserva)/t.e*100)):(t.s>0?100:0);
  var ult=new Date(state.y,state.m+1,0).getDate(),dias=idx===IDX_HOJE?ult-hoje.getDate()+1:0;
  var frase;
  if(t.e===0&&t.s===0&&t.g===0)frase="Nenhum lançamento neste mês ainda. Toque em “+ Lançar”.";
  else if(livre<0)frase="Você passou "+R(-livre)+" do que podia"+(temMeta?" para conseguir guardar "+R(reserva):"")+". Veja onde cortar na aba Guardar.";
  else if(dias>0)frase="Dá para gastar "+R(Math.floor(livre/dias))+" por dia até o fim do mês"+(temMeta?", já separando "+R(reserva)+" para guardar.":".");
  else frase=temMeta?"Já descontando "+R(reserva)+" para guardar.":"Tudo que entrou menos tudo que saiu.";
  var h='<div class="sobra"><div class="rot">'+(livre<0?"Passou do limite":temMeta?"Livre para gastar":"Sobra no mês")+'</div>'+
    '<div class="num'+(livre<0?" neg":"")+'" id="hero"></div>'+
    '<div class="trilho"><b class="'+(livre<0?"est":"")+'" style="width:'+pct+'%"></b></div><p>'+frase+'</p></div>'+
    '<div class="duo"><div class="card"><div class="rot">Entrou</div><div class="val in">'+R(t.e)+'</div></div>'+
    '<div class="card"><div class="rot">Saiu</div><div class="val out">'+R(t.s)+'</div></div></div>';
  h+=bancosHtml();
  h+='<div class="card"><h2>Guardar este mês</h2>';
  if(M>0){var pg=Math.min(100,Math.round(t.g/M*100));
    h+='<div class="linha"><div class="t">'+R(t.g)+' de '+R(M)+'</div><div class="v '+(t.g>=M?"in":"")+'">'+(t.g>=M?"Meta batida":pg+"%")+'</div></div>'+
      '<div class="barra g"><b class="ok" style="width:'+pg+'%"></b></div>'+
      '<button type="button" class="cheio" data-novo="reserva">Guardar dinheiro agora</button>';
  }else h+='<p>Diga quanto quer guardar por mês e o app passa a separar esse valor antes de mostrar o que está livre.</p><a class="cheio" href="#guardar">Definir minha meta</a>';
  h+='</div>';
  var fp=faltaPagar(idx);
  h+='<div class="card"><a class="atalho" href="#contas"><span>Contas que faltam pagar ›</span><b class="'+(fp>0?"out":"in")+'">'+R(fp)+'</b></a></div>';
  h+='<div class="card"><h2>Onde seu dinheiro foi</h2>'+rankingHtml(idx)+'</div>';
  $("#t-resumo").innerHTML=h;
  anima($("#hero"),heroAnt,livre);heroAnt=livre;
}
function sub(x){
  var s=esc(x.it.cat)+" · "+esc(x.it.forma);
  var bn=x.it.banco&&bancos().find(function(b){return b.id===x.it.banco});if(bn)s+=" · "+esc(bn.nome);
  if(x.o.de>1)s+=" · parcela "+x.o.k+"/"+x.o.de;
  if(x.it.fixo)s+=" · fixo";
  return s;
}
function lancado(it){
  if(!it.criado)return"";var d=new Date(it.criado);
  return"Lançado em "+d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function extrato(idx){
  var todos=doMes(idx),lista=todos.filter(function(x){return state.filtro==="todos"||x.it.tipo===state.filtro});
  var h='<div class="filtros">';
  [["todos","Tudo"],["entrada","Entradas"],["saida","Saídas"]].forEach(function(f){

function ehConta(it){return it.tipo==="saida"&&(it.aPagar||it.fixo||(it.parcelas||1)>1)}

var FERIADOS=["1-1","4-21","5-1","9-7","10-12","11-2","11-15","11-20","12-25"];
/* 5º dia útil para pagamento de salário: conta de segunda a sábado e pula feriados nacionais de data fixa. */
function quintoUtil(idx){var y=Math.floor(idx/12),m=idx%12,n=0;
  for(var d=1;d<=31;d++){if(new Date(y,m,d).getDay()!==0&&FERIADOS.indexOf((m+1)+"-"+d)<0)n++;if(n===5)return d}
  return 7}
function diaNoMes(it,idx){if(it.quinto)return quintoUtil(idx);var d=Number(it.data.slice(8)),ult=new Date(Math.floor(idx/12),idx%12+1,0).getDate();return Math.min(d,ult)}
function quando(idx,d){var t=new Date(Math.floor(idx/12),idx%12,d).getTime(),h=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()).getTime();return t<h?-1:t>h?1:0}
function faltaPagar(idx){var f=0;doMes(idx).forEach(function(x){if(ehConta(x.it)&&!estaPago(x.it,idx))f+=x.o.valor});return f}
function contas(idx){

    else if(ehConta(x.it)){x.pg=estaPago(x.it,idx);cts.push(x);if(x.pg)pago+=x.o.valor;else falta+=x.o.valor}
  });
  var porDia=function(a,b){return a.d-b.d};rec.sort(porDia);cts.sort(porDia);
  var h='<div class="duo"><div class="card"><div class="rot">Falta pagar</div><div class="val out">'+R(falta)+'</div></div>'+

  h+='<div class="card"><h2>Quando você recebe</h2>';

    h+='<div class="conta"><span class="dia">'+x.d+'</span><button type="button" class="meio" data-id="'+esc(x.it.id)+'"><span class="t">'+esc(x.it.desc)+'</span>'+
      '<span class="s">'+(q<0?"Recebido":q===0?"Cai hoje":"Cai dia "+x.d)+' · '+esc(x.it.cat)+(x.it.quinto?" · 5º dia útil":"")+(x.it.fixo?" · todo mês":"")+'</span></button>'+
      '<span class="v in">+ '+R(x.o.valor)+'</span></div>'});
  if(rec.length>1)h+='<div class="conta"><span></span><span class="t">Total do mês</span><span class="v in">'+R(recebe)+'</span></div>';
  h+='<button type="button" class="mais" data-novo="salario">+ Salário (5º dia útil)</button>'+
    '<button type="button" class="mais" data-novo="vale">+ Vale (adiantamento)</button>'+

function parceladas(idx){
  var ativos=[],falta=0;
  dados().forEach(function(it){
    if(it.tipo!=="saida"||it.fixo||(it.parcelas||1)<2)return;
    var o=ocorre(it,idx);if(!o)return;
    var resto=0;for(var k=idx;k<idxDe(it.data)+it.parcelas;k++)resto+=ocorre(it,k).valor;
    ativos.push({it:it,o:o,resto:resto});falta+=resto;
  });
  if(!ativos.length)return"";
  ativos.sort(function(a,b){return b.resto-a.resto});
  var h='<div class="card"><h2>Compras parceladas</h2><p class="s">Somando tudo, ainda falta pagar '+R(falta)+'.</p>';
  ativos.forEach(function(a){var fim=idxDe(a.it.data)+a.it.parcelas-1;
    h+='<div class="linha"><div><div class="t">'+esc(a.it.desc)+'<span class="pill">'+a.o.k+' de '+a.o.de+'</span></div>'+
      '<div class="s">termina em '+esc(mesAno(fim))+' · falta '+R(a.resto)+'</div></div>'+
      '<div class="v">'+R(a.o.valor)+'<div class="s" style="font-weight:500">por mês</div></div>'+
      '<div class="barra"><b style="width:'+Math.round(a.o.k/a.o.de*100)+'%"></b></div></div>'});
  return h+'</div>';
}
function guardarTela(idx){

  h+='</div>';

  ms.forEach(function(m){h+='<div class="col" title="'+esc(mesAno(m.idx))+': entrou '+R(m.t.e)+', saiu '+R(m.t.s)+'">'+
    '<i class="e" style="height:'+(m.t.e/max*100)+'%"></i><i class="s" style="height:'+(m.t.s/max*100)+'%"></i></div>'});
  h+='</div><div class="colsleg">';
  ms.forEach(function(m){var sb=m.t.e-m.t.s;h+='<div>'+esc(nomeMes(m.idx))+'<b class="'+(sb<0?"out":"in")+'">'+curto(sb)+'</b></div>'});

$("#novo").addEventListener("click",function(){abrir(null)});
$("#mes-ant").addEventListener("click",function(){state.m--;if(state.m<0){state.m=11;state.y--}desenhar()});
$("#mes-prox").addEventListener("click",function(){state.m++;if(state.m>11){state.m=0;state.y++}desenhar()});

var PRE={
  salario:{tipo:"entrada",cat:"Salário",desc:"Salário",fixo:true,quinto:true,titulo:"Salário (5º dia útil)"},
  extra:{tipo:"entrada",cat:"Extra",desc:"Extra",titulo:"Dinheiro extra"},
  parcelada:{tipo:"saida",cat:"Compras",parcelas:2,abrir:true,titulo:"Compra parcelada"},
  vale:{tipo:"entrada",cat:"Adiantamento",desc:"Vale",fixo:true,dia:20,titulo:"Vale (adiantamento)"},
  conta:{tipo:"saida",cat:"Contas",fixo:true,aPagar:true,titulo:"Conta para pagar"},
  reserva:{tipo:"saida",cat:RES,desc:"Guardado",titulo:"Guardar dinheiro"}
};
document.querySelector(".wrap").addEventListener("click",function(e){
  var alvo=e.target.closest("[data-conta],[data-addbanco],[data-banco],[data-novo],[data-f],[data-acao],[data-pg],[data-id]");if(!alvo)return;
  var d=alvo.dataset;
  if(d.conta)return abrir(null,{tipo:"saida",cat:d.cat,desc:d.conta==="Outra"?"":d.conta,fixo:true,aPagar:true,titulo:d.conta==="Outra"?"Conta fixa":"Conta fixa: "+d.conta});
  if(d.addbanco)return abrirBanco(null);
  if(d.banco)return abrirBanco(state.iniciado?state.bancos.find(function(b){return b.id===d.banco})||null:null);
  if(d.novo){var pre=Object.assign({},PRE[d.novo]);
    if(d.novo==="reserva"&&state.iniciado){var falta=(state.meta||0)-totais(idxAtual()).g;if(falta>0)pre.valor=falta}
    return abrir(null,pre)}
  if(d.f){state.filtro=d.f;return extrato(idxAtual())}
  if(d.acao==="meta"){var txt=$("#g-meta").value.trim(),v=txt?parseValor(txt):0;
    if(!(v>=0)){$("#g-meta").focus();return}
    state.meta=v;guardar("__meta");desenhar();return}
  if(!state.iniciado)return abrir(null);
  var it=state.items.find(function(x){return x.id===(d.pg||d.id)});if(!it)return;
  if(d.pg){var pg=Object.assign({},it.pagos),k=String(idxAtual());if(pg[k])delete pg[k];else pg[k]=Date.now();it.pagos=pg;
    guardar(it.id);desenhar();return}
  abrir(it);
});

lerLocal();aba();desenhar();ligarConta();
})();
</script>
</body>
</html>
